[project]
channels = ["nodefaults", "conda-forge", "bioconda"]
name = "parnet"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10,<3.11"
pip = ">=25.1"
ipykernel = ">=6.29"
pyarrow = ">=17.0,<21.0"
pandas = ">=2.0,<2.4"
numpy = ">=1.26,<2.0"
click = ">=8.2,<9.0"
gin-config = "==0.5.0"
ipython = ">=8.37,<9.0"
pyyaml = ">=6.0,<7.0"
rich = ">=14.0,<15.0"
datasets = ">=3.6,<4.0"
transformers = ">=4.40,<5"
jaxtyping = ">=0.3.2,<0.4"
lightning = ">=2.3"
lightning-utilities = ">=0.14,<0.15"
biopython = ">=1.83,<1.85"
pybigwig = ">=0.3.22,<0.4"
pybedtools = ">=0.12.0,<0.13"

[pypi-dependencies]
sequence-models = ">=1.8,<2.0"
tensorboard = ">=2.16,<2.17"

###

[feature.cpu.dependencies]
pytorch-cpu = { version = "==2.5.1", channel = "conda-forge" }

[feature.cpu.pypi-dependencies]
tensorflow = { version = ">=2.16,<2.17" }

###

[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "11.8" } # NOTE: this was required for correct package resolution.

[feature.gpu.dependencies]
cuda-version = "11.8.*"
cudatoolkit = "11.8.*"
pytorch-gpu = { version = "==2.5.1", channel = "conda-forge" }

[feature.gpu.pypi-dependencies]
tensorflow = { version = ">=2.16,<2.17", extras = ["and-cuda"] }

###

[feature.dev.dependencies]
ruff = ">=0.11,<1.0"
mkdocstrings-python = ">=1.16,<2.0"
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.6,<10.0"
pytest = ">=8.4,<9"
pytest-cov = ">=6.0,<7.0"
pre-commit = ">=4.0,<5.0"
mypy = ">=1.11,<2.0"


[feature.dev.pypi-dependencies]
parnet = { path = ".", editable = true }

###

[environments]

parnet = { features = ["cpu"], solve-group = "cpu" }
parnet-dev = { features = ["cpu", "dev"], solve-group = "cpu" }
parnet-gpu = { features = ["gpu"], solve-group = "gpu" }
parnet-gpu-dev = { features = ["gpu", "dev"], solve-group = "gpu" }
